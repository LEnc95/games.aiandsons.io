<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Cade's Games — a browser arcade by Ai and Sons</title>
  <desc id="desc">A purple and teal arcade controller beside the words Play, discover, together.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#17102f"/><stop offset="1" stop-color="#0d192b"/></linearGradient>
