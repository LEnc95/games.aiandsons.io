name: Weekly Release

on:
  schedule:
    - cron: "0 14 * * 0"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Prepare release files
        run: npm run release:prepare-weekly
      - name: Skip an already prepared week
        id: changes
        shell: bash
        run: |
          if git diff --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.changes.outputs.changed == 'true'
        run: npm run game:preflight
      - if: steps.changes.outputs.changed == 'true'
        run: npm run test:policy-gate
      - if: steps.changes.outputs.changed == 'true'
        run: npm run test:telemetry
      - if: steps.changes.outputs.changed == 'true'
        run: npm run test:shop
      - if: steps.changes.outputs.changed == 'true'
        run: npm run test:social
      - if: steps.changes.outputs.changed == 'true'
        run: npm run test:feedback
      - if: steps.changes.outputs.changed == 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.changes.outputs.changed == 'true'
        run: npm run test:launch-readiness-smoke
      - name: Open and merge the validated release PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          WEEK=$(node -p "require('./release/weekly-state.json').lastReleasedWeek")
          BRANCH="automation/weekly-release/${WEEK}"
          EXISTING_PR=$(gh pr list --state open --limit 100 --json headRefName,url --jq '[.[] | select(.headRefName | startswith("automation/weekly-release/"))] | .[0].url // empty')
          if [ -n "$EXISTING_PR" ]; then
            echo "Release PR already exists: $EXISTING_PR"
            EXISTING_BRANCH=$(gh pr view "$EXISTING_PR" --json headRefName --jq .headRefName)
            git fetch origin "$EXISTING_BRANCH"
            if ! git diff --quiet FETCH_HEAD -- CHANGELOG.md TECHNICAL_CHANGELOG.md package.json package-lock.json version.json release/weekly-state.json; then
              echo "::error::The existing release PR differs from the files validated in this run."
              exit 1
            fi
            PR_URL="$EXISTING_PR"
            HEAD_SHA=$(gh pr view "$PR_URL" --json headRefOid --jq .headRefOid)
          else
            git config user.name "cade-maintenance-bot"
            git config user.email "actions@users.noreply.github.com"
            git switch -c "$BRANCH"
            git add CHANGELOG.md TECHNICAL_CHANGELOG.md package.json package-lock.json version.json release/weekly-state.json
            git commit -m "Prepare weekly release ${VERSION}"
            REMOTE_SHA=$(git ls-remote --heads origin "$BRANCH" | cut -f1)
            if [ -n "$REMOTE_SHA" ]; then
              # Recover an orphaned branch left by a run that failed before PR creation.
              git push --force-with-lease="refs/heads/$BRANCH:$REMOTE_SHA" origin "HEAD:$BRANCH"
            else
              git push origin "HEAD:$BRANCH"
            fi
            HEAD_SHA=$(git rev-parse HEAD)
            PR_URL=$(gh pr create --base main --head "$BRANCH" --title "Weekly release ${VERSION}" --body "Automated public and technical release feeds, synchronized version, and validated maintenance state.")
          fi
          echo "Release PR: $PR_URL"
          EXPECTED_FILES=$(printf '%s\n' CHANGELOG.md TECHNICAL_CHANGELOG.md package.json package-lock.json version.json release/weekly-state.json | LC_ALL=C sort)
          ACTUAL_FILES=$(gh pr view "$PR_URL" --json files --jq '.files[].path' | LC_ALL=C sort)
          if [ "$ACTUAL_FILES" != "$EXPECTED_FILES" ]; then
            echo "::error::The weekly release PR contains unexpected or missing paths."
            exit 1
          fi
          gh pr merge "$PR_URL" --squash --match-head-commit "$HEAD_SHA"
          gh workflow run main-qa.yml --ref main
          gh workflow run production-maintenance-verify.yml --ref main
