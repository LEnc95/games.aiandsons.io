name: Automation Auto Merge

on:
  workflow_run:
    workflows: [Automation Premerge Gate]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      ((github.event.workflow_run.event == 'pull_request' &&
        startsWith(github.event.workflow_run.head_branch, 'automation/') &&
        !startsWith(github.event.workflow_run.head_branch, 'automation/weekly-release/')) ||
       (github.event.workflow_run.event == 'workflow_dispatch' &&
        startsWith(github.event.workflow_run.head_branch, 'automation/weekly-release/')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for every PR check and enable squash auto-merge
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          RUN_BRANCH: ${{ github.event.workflow_run.head_branch }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$RUN_EVENT" = "workflow_dispatch" ]; then
            PR_NUMBER=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$RUN_BRANCH" --json number --jq '.[0].number // empty')
            if [ -z "$PR_NUMBER" ]; then
              echo "::error::No open weekly release PR for $RUN_BRANCH."
              exit 1
            fi
            PR_HEAD_SHA=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)
            if [ "$PR_HEAD_SHA" != "$RUN_HEAD_SHA" ]; then
              echo "::error::The release PR changed after its validation run."
              exit 1
            fi
            EXPECTED_FILES=$(printf '%s\n' CHANGELOG.md TECHNICAL_CHANGELOG.md package.json package-lock.json version.json release/weekly-state.json | LC_ALL=C sort)
            ACTUAL_FILES=$(gh pr view "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --json files --jq '.files[].path' | LC_ALL=C sort)
            if [ "$ACTUAL_FILES" != "$EXPECTED_FILES" ]; then
              echo "::error::The weekly release PR contains unexpected or missing paths."
              exit 1
            fi
            gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash --match-head-commit "$RUN_HEAD_SHA"
            exit 0
          fi
          # workflow_run jobs attach to the default-branch run, not the PR head,
          # so this rollup contains the PR checks without waiting on this job.
          if ! gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --watch --fail-fast --interval 10; then
            echo "::error::A pull-request check failed or did not finish; refusing to merge."
            exit 1
          fi
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash

