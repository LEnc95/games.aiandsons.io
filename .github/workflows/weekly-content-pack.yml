name: Weekly Content Pack Brief

on:
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: weekly-content-pack
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
      - name: Generate deterministic agent brief
        run: node scripts/automation/prepare-weekly-pack.mjs --output output/automation/weekly-pack.json
      - name: Validate maintenance baseline
        run: npm run maintenance:validate
      - uses: actions/upload-artifact@v7
        with:
          name: weekly-content-pack-brief
          path: output/automation/weekly-pack.json
      - name: Create agent work item
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          WEEK_KEY=$(node -e "const x=require('./output/automation/weekly-pack.json');process.stdout.write(x.weekKey)")
          TITLE="Weekly content pack ${WEEK_KEY}"
          LABEL="automation:weekly-pack"
          gh label create "$LABEL" --color "1d76db" --description "Generated weekly cosmetics and challenges work item" --force

          CURRENT_NUMBER=$(gh issue list --state all --search "${TITLE} in:title" --json number,title --jq ".[] | select(.title == \"${TITLE}\") | .number" | head -n 1)
          if [ -z "$CURRENT_NUMBER" ]; then
            CURRENT_URL=$(gh issue create --title "$TITLE" --label "$LABEL" --body-file output/automation/weekly-pack.json)
            CURRENT_NUMBER=${CURRENT_URL##*/}
          else
            gh issue edit "$CURRENT_NUMBER" --add-label "$LABEL"
          fi

          gh issue list --state open --search "Weekly content pack in:title" --json number,title \
            --jq ".[] | select(.number != ${CURRENT_NUMBER}) | select(.title | test(\"^Weekly content pack [0-9]{4}-W[0-9]{2}$\")) | .number" |
          while read -r NUMBER; do
            [ -z "$NUMBER" ] && continue
            gh issue close "$NUMBER" --reason "not planned" --comment "Superseded by #${CURRENT_NUMBER}."
          done
