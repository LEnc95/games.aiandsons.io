  <meta charset="utf-8">

  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="stylesheet" href="/sticktilt/styles.css">
  <style>
    #roster li { grid-template-columns:28px 1fr auto; min-height:36px; padding:4px 8px; }
    #roster li i { width:28px; height:28px; display:grid; place-items:center; font-size:17px; font-style:normal; }
    .party-reduced-motion * { animation:none!important; transition:none!important; }
    .party-high-contrast { --ink:#fff; --muted:#eef7ff; --line:rgba(255,255,255,.62); filter:contrast(1.12); }
    .party-high-contrast .stage-wrap,.party-high-contrast .join-panel,.party-high-contrast .roster-panel { border-color:rgba(255,255,255,.72); }
  </style>

  <script type="application/ld+json" data-seo-managed="true">{"@context":"https://schema.org","@type":"VideoGame","name":"Stick & Tilt","description":"Tilt your phone to move a stick fighter. Punch, jump, and guard through three quick rounds with 2–8 friends. Play for free on AI and Sons Games.","url":"https://games.aiandsons.io/sticktilt","gamePlatform":"Web Browser","genre":"Arcade","applicationCategory":"Game","inLanguage":"en-US","isAccessibleForFree":true,"publisher":{"@id":"https://games.aiandsons.io#organization"},"isPartOf":{"@id":"https://games.aiandsons.io#games"}}</script>

<body>
  <a class="back" href="/party/">← Party Games</a>
  <main class="host-shell">
    <header class="host-header">
      <div><p class="eyebrow">AI and Sons Party Games</p><h1>Stick <em>&amp; Tilt</em></h1></div>
      <div class="header-status"><span id="screenRole">Host screen</span><div id="serverStatus" aria-live="polite">Connecting…</div></div>
    </header>
    <section class="game-layout">
      <div class="stage-wrap" id="stageWrap">
        <canvas id="game" width="1200" height="675" aria-label="Stick &amp; Tilt shared party screen"></canvas><p class="arena-caption">2–8 fighters · Tilt to move · Punch, jump, guard · 1 point per knockout · Ties share the win</p>
      </div>
      <aside class="host-panel">
        <section class="join-panel">
          <p class="eyebrow">Join on your phone</p>
          <div id="roomCode" class="room-code">----</div>
          <p>Go to <strong>games.aiandsons.io/party</strong></p>
          <div id="qrCode" class="qr-code" aria-label="QR code to join this Stick &amp; Tilt room"></div>
          <button id="shareScreenButton" type="button" disabled>Copy link for another screen</button>
          <p id="screenCount" class="screen-count">1 live screen</p>
        </section>
        <section class="roster-panel">
          <div class="panel-heading"><h2>Players</h2><span id="playerCount">0 / 8</span></div>
          <ol id="roster" aria-live="polite"></ol>
        </section>
        <div class="host-actions">
          <button id="startButton" class="primary" type="button" disabled>Start with 2 players</button>
          <button id="pauseButton" type="button" hidden>Pause</button>
          <button id="endButton" class="danger" type="button" hidden>End game</button>
          <button id="fullscreenButton" type="button">Fullscreen (F)</button>
          <button id="soundButton" type="button">Sound: Off</button>
        </div>
        <p id="hostError" class="error" role="alert"></p>
      </aside>
    </section>
  </main>
  <script src="/party/vendor/qrcode.js"></script>
  <script type="module" src="/sticktilt/game.js"></script>
  <script type="module">
    import { mountGameFeedback } from "/src/feedback/embed.js";
    if (!new URLSearchParams(location.search).has("embedded")) mountGameFeedback({ gameSlug: "sticktilt", gameName: "Stick & Tilt" });
  </script>
</body>
</html>
