</head><body><main><h1>📄 Paper Bridge</h1><canvas id="game" width="840" height="600" tabindex="0" aria-label="Paper Bridge game"></canvas><div class="controls"><button id="short">− Fold</button><button id="place">Place</button><button id="long">+ Fold</button><button id="pause">Pause</button><button id="restart">Restart</button><button id="theme">Colors</button><button id="full">Full</button><button id="feedback">Feedback</button></div><p class="help"><b>Bridge five ravines.</b> Change the paper plank length with ←/→, then press Space to place it. Reach the far bank without falling three times. Tap left/right on the canvas to fold; tap the center to place. P pauses, R restarts, T changes colors, F toggles fullscreen.</p></main><script type="module">
import { addCoins } from '/src/core/state.js';import { reportGameOutcome } from '/src/core/outcomes.js';import { mountGameFeedback } from '/src/feedback/embed.js';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),palettes=[{name:'Notebook',sky:'#dff3f7',far:'#91c7b1',near:'#427b68',paper:'#fffdf4',line:'#5a7ba5',accent:'#ed8b5a',ink:'#183642'},{name:'Sunset',sky:'#ffe3c7',far:'#c99081',near:'#74546a',paper:'#fff4dc',line:'#b85c70',accent:'#ffd166',ink:'#392f45'},{name:'Blueprint',sky:'#d8eaff',far:'#6f9fd0',near:'#285a8d',paper:'#eaf7ff',line:'#3478b8',accent:'#ffcc54',ink:'#173754'}],gaps=[150,185,220,255,290],state={mode:'menu',ravine:0,length:150,bridges:0,falls:0,elapsed:0,theme:0,placing:0,last:null,started:false,reported:false};let manual=false,previous=performance.now();
const p=()=>palettes[state.theme],target=()=>gaps[state.ravine],tolerance=()=>Math.max(15,27-state.ravine*2),metrics=()=>({bridges:state.bridges,ravines:state.bridges,falls:state.falls});
function report(result){if(!state.started||state.reported)return;state.reported=true;reportGameOutcome({slug:'paperbridge',result,durationMs:Math.round(state.elapsed),metrics:metrics()})}function restart(){report('abandoned');Object.assign(state,{mode:'menu',ravine:0,length:150,bridges:0,falls:0,elapsed:0,placing:0,last:null,started:false,reported:false});render()}function start(){if(state.mode==='menu'){state.mode='playing';state.started=true}else if(state.mode==='crossed'){state.ravine++;state.length=150;state.last=null;state.mode='playing'}else if(['won','lost'].includes(state.mode)){restart();state.started=true;state.mode='playing'}render()}function fold(delta){if(state.mode!=='playing'){start();return}if(state.placing)return;state.length=Math.max(90,Math.min(350,state.length+delta*10));render()}function place(){if(state.mode!=='playing'){start();return}if(state.placing)return;state.placing=500;state.last=null;render()}function finishPlacement(){const hit=Math.abs(state.length-target())<=tolerance();state.last=hit?'bridge':'fall';if(hit){state.bridges++;if(state.ravine===4){state.mode='won';addCoins(15);report('completed')}else state.mode='crossed'}else{state.falls++;if(state.falls>=3){state.mode='lost';report('lost')}else state.length=150}}function pause(){if(state.mode==='playing')state.mode='paused';else if(state.mode==='paused')state.mode='playing';render()}function update(ms){if(state.mode!=='playing')return;state.elapsed+=ms;if(state.placing){state.placing=Math.max(0,state.placing-ms);if(!state.placing)finishPlacement()}}function step(ms){let remaining=Math.max(0,Number(ms)||0);if(!Number.isFinite(remaining))return;while(remaining>0){const slice=Math.min(10,remaining);update(slice);remaining-=slice}render()}function text(s,x,y,size=20,color=p().ink){ctx.fillStyle=color;ctx.font=`700 ${size}px system-ui`;ctx.textAlign='center';ctx.fillText(s,x,y)}
function overlay(title,sub,hint){ctx.fillStyle='#102632dd';ctx.fillRect(115,180,610,230);text(title,420,245,40,'#fff');text(sub,420,300,21,'#eaf7ff');text(hint,420,355,18,p().accent)}function render(){const q=p(),gap=target(),leftEnd=420-gap/2,rightStart=420+gap/2;ctx.fillStyle=q.sky;ctx.fillRect(0,0,840,600);ctx.fillStyle=q.far;ctx.beginPath();ctx.moveTo(0,185);ctx.quadraticCurveTo(210,105,420,170);ctx.quadraticCurveTo(650,110,840,185);ctx.lineTo(840,330);ctx.lineTo(0,330);ctx.fill();ctx.fillStyle=q.near;ctx.fillRect(0,330,leftEnd,270);ctx.fillRect(rightStart,330,840-rightStart,270);ctx.fillStyle='#20313d';ctx.fillRect(leftEnd,330,gap,270);for(let i=0;i<9;i++){ctx.strokeStyle='#ffffff20';ctx.beginPath();ctx.moveTo(leftEnd+i*gap/8,340);ctx.lineTo(leftEnd+(i-1)*gap/8,600);ctx.stroke()}text(`RAVINE ${state.ravine+1} / 5`,420,46,18);text(`Bridges ${state.bridges}   Falls ${state.falls}/3`,420,76,18);const progress=state.placing?1-state.placing/500:0,angle=state.placing?-Math.PI/2+progress*Math.PI/2:0;ctx.save();ctx.translate(leftEnd-6,326);ctx.rotate(angle);ctx.fillStyle=q.paper;ctx.strokeStyle=q.line;ctx.lineWidth=4;ctx.fillRect(0,-18,state.length,36);ctx.strokeRect(0,-18,state.length,36);for(let x=25;x<state.length;x+=25){ctx.beginPath();ctx.moveTo(x,-16);ctx.lineTo(x,16);ctx.stroke()}ctx.restore();ctx.strokeStyle=q.accent;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(rightStart-tolerance(),315);ctx.lineTo(rightStart+tolerance(),315);ctx.stroke();text(`Fold ${state.length} • gap ${gap}`,420,555,20,q.paper);if(state.mode==='menu')overlay('PAPER BRIDGE','Fold the plank to match the gap.','Press Space or tap to begin');else if(state.mode==='paused')overlay('PAUSED','The paper waits in the wind.','Press P to continue');else if(state.mode==='crossed')overlay('BRIDGE HOLDS!',`Ravine ${state.ravine+1} crossed.`,'Press Space for the next ravine');else if(state.mode==='won')overlay('ALL BANKS JOINED!',`Five bridges, ${state.falls} falls.`,'Press Space to play again');else if(state.mode==='lost')overlay('PAPER DOWN!',`${state.bridges} bridges held.`,'Press Space to try again');else if(state.last==='fall'&&!state.placing)text('Too short or too long — refold!',420,120,22,q.accent)}
function cycleTheme(){state.theme=(state.theme+1)%palettes.length;render()}async function fullscreen(){if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}document.querySelector('#short').onclick=()=>fold(-1);document.querySelector('#long').onclick=()=>fold(1);document.querySelector('#place').onclick=place;document.querySelector('#pause').onclick=pause;document.querySelector('#restart').onclick=restart;document.querySelector('#theme').onclick=cycleTheme;document.querySelector('#full').onclick=fullscreen;document.querySelector('#feedback').onclick=()=>{if(state.mode==='playing')pause();document.querySelector('#cadeFeedbackOpenBtn')?.click()};canvas.addEventListener('pointerdown',e=>{canvas.focus();if(state.mode!=='playing'){start();return}const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)/r.width;if(x<.36)fold(-1);else if(x>.64)fold(1);else place()});document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable="true"],[role="dialog"]')||document.documentElement.dataset.cadeFeedbackOpen==='1')return;const k=e.key.toLowerCase();if(['arrowleft','arrowright',' ','enter','p','r','t','f'].includes(k)){if((k===' '||k==='enter')&&e.target.tagName==='BUTTON')return;e.preventDefault();if(e.repeat)return;if(k==='arrowleft')fold(-1);else if(k==='arrowright')fold(1);else if(k===' '||k==='enter')place();else if(k==='p')pause();else if(k==='r')restart();else if(k==='t')cycleTheme();else if(k==='f')fullscreen()}if(k==='escape'&&document.fullscreenElement)document.exitFullscreen()});window.advanceTime=ms=>{manual=true;step(ms)};window.render_game_to_text=()=>JSON.stringify({coordinateSystem:'840x600 canvas; origin top-left; x right, y down; banks surround a centered ravine',mode:state.mode,ravine:state.ravine+1,totalRavines:5,plankLength:state.length,gapLength:target(),tolerance:tolerance(),placementMs:Math.round(state.placing),bridges:state.bridges,falls:state.falls,timeMs:Math.round(state.elapsed),theme:p().name,lastResult:state.last,metrics:metrics(),controls:'Left/Right fold; Space places; tap left/right folds and center places; P pause; R restart; T palette; F fullscreen'});window.addEventListener('pagehide',()=>report('abandoned'));document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.mode==='playing')pause()});mountGameFeedback({gameSlug:'paperbridge',gameName:'Paper Bridge'});function frame(now){if(!manual)step(Math.min(50,now-previous));previous=now;requestAnimationFrame(frame)}render();requestAnimationFrame(frame);
</script></body></html>
