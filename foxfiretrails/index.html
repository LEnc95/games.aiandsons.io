</head><body><main><h1>🦊 Foxfire Trails</h1><canvas id="game" width="840" height="600" tabindex="0" aria-label="Foxfire Trails game"></canvas><div class="controls"><button data-move="up">↑</button><button data-move="left">←</button><button data-move="down">↓</button><button data-move="right">→</button><button id="pause">Pause</button><button id="restart">Restart</button><button id="theme">Colors</button><button id="full">Full</button><button id="feedback">Feedback</button></div><p class="help"><b>Light five forest trails.</b> Guide the fox to each blue wisp in order while avoiding brambles. Use arrow keys, WASD, the direction buttons, or tap a neighboring clearing. Three bumps end the journey. P pauses, R restarts, T changes colors, F toggles fullscreen.</p></main><script type="module">
import { addCoins } from '/src/core/state.js';import { reportGameOutcome } from '/src/core/outcomes.js';import { mountGameFeedback } from '/src/feedback/embed.js';

];
const palettes=[
  {name:'Fern',sky:'#eaf6e1',far:'#8fc27d',ground:'#477d4c',tile:'#cce2a7',edge:'#315b39',wisp:'#7ef8ff',glow:'#d8ffff',thorn:'#773d55',fox:'#ed7b3b',tail:'#fff2cf',ink:'#203221',trail:'#ffd45d'},
  {name:'Moon',sky:'#dfe9ff',far:'#7285ba',ground:'#35466f',tile:'#7184a5',edge:'#202c52',wisp:'#aafcff',glow:'#efffff',thorn:'#522f62',fox:'#ff9a62',tail:'#f8e8d4',ink:'#14203f',trail:'#ffe38b'},
  {name:'Ember',sky:'#ffe3c7',far:'#d78363',ground:'#7d3f46',tile:'#bd775f',edge:'#552b3a',wisp:'#9df5dd',glow:'#edfff9',thorn:'#321f35',fox:'#ffbe55',tail:'#fff0d0',ink:'#3c2130',trail:'#fff08a'}
];
const state={mode:'menu',trail:0,pos:[0,4],wisp:0,wisps:0,bumps:0,elapsed:0,theme:0,started:false,reported:false,message:''};let manual=false,previous=performance.now();const p=()=>palettes[state.theme],level=()=>levels[Math.min(state.trail,4)],metrics=()=>({wisps:state.wisps,trails:state.trail,bumps:state.bumps}),same=(a,b)=>a[0]===b[0]&&a[1]===b[1];
function report(result){if(!state.started||state.reported)return;state.reported=true;reportGameOutcome({slug:'foxfiretrails',result,durationMs:Math.round(state.elapsed),metrics:metrics()})}

function move(dx,dy){if(['menu','between','won','lost'].includes(state.mode))start();if(state.mode!=='playing')return;const next=[Math.max(0,Math.min(N-1,state.pos[0]+dx)),Math.max(0,Math.min(N-1,state.pos[1]+dy))];if(same(next,state.pos)){state.message='The trail ends there.';render();return}if(level().thorns.some(t=>same(t,next))){state.bumps++;state.message='Bramble bump! Back to the trailhead.';state.pos=[...level().start];if(state.bumps>=3){state.mode='lost';report('lost')}render();return}state.pos=next;state.message='';if(same(state.pos,level().wisps[state.wisp])){state.wisps++;state.wisp++;state.message='Wisp gathered!';if(state.wisp>=level().wisps.length){state.trail++;if(state.trail>=levels.length){state.mode='won';addCoins(15);report('completed')}else state.mode='between'}}render()}

function update(ms){if(state.mode==='playing')state.elapsed+=ms}
function step(ms){let n=Math.max(0,Number(ms)||0);if(!Number.isFinite(n))return;while(n>0){const d=Math.min(10,n);update(d);n-=d}render()}
function text(s,x,y,size=20,color=p().ink){ctx.fillStyle=color;ctx.font=`700 ${size}px system-ui`;ctx.textAlign='center';ctx.fillText(s,x,y)}
function roundRect(x,y,w,h,r,fill){ctx.fillStyle=fill;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}
function drawWisp(x,y){const q=p(),pulse=6+Math.sin(state.elapsed/180)*2;ctx.fillStyle=q.glow;ctx.globalAlpha=.5;ctx.beginPath();ctx.arc(x,y,28+pulse,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;ctx.fillStyle=q.wisp;ctx.beginPath();ctx.arc(x,y,15,0,Math.PI*2);ctx.fill();ctx.fillStyle=q.glow;ctx.beginPath();ctx.ellipse(x+7,y-16,7,13,.5,0,Math.PI*2);ctx.fill()}

function overlay(a,b,c){ctx.fillStyle='#14221ddd';ctx.fillRect(105,170,630,245);text(a,420,238,40,'#fff');text(b,420,300,21,'#efffe8');text(c,420,360,18,p().trail)}
function render(){const q=p();ctx.fillStyle=q.sky;ctx.fillRect(0,0,840,600);ctx.fillStyle=q.far;ctx.beginPath();ctx.moveTo(0,155);ctx.quadraticCurveTo(210,65,420,155);ctx.quadraticCurveTo(630,55,840,155);ctx.lineTo(840,600);ctx.lineTo(0,600);ctx.fill();ctx.fillStyle=q.ground;ctx.fillRect(0,150,840,450);text(`TRAIL ${Math.min(5,state.trail+1)} / 5`,420,38,18);text(`Wisps ${state.wisps}/20   Bumps ${state.bumps}/3`,420,68,18);for(let y=0;y<N;y++)for(let x=0;x<N;x++){const px=ox+x*cell,py=oy+y*cell;roundRect(px,py,cell-8,cell-8,15,q.tile);ctx.strokeStyle=q.edge;ctx.lineWidth=3;ctx.strokeRect(px+5,py+5,cell-18,cell-18)}if(state.mode!=='won'){level().thorns.forEach(([x,y])=>drawThorn(ox+x*cell+35,oy+y*cell+35));const w=level().wisps[state.wisp];if(w)drawWisp(ox+w[0]*cell+35,oy+w[1]*cell+35);drawFox(ox+state.pos[0]*cell+35,oy+state.pos[1]*cell+35)}if(state.message&&state.mode==='playing')text(state.message,420,555,17,q.trail);if(state.mode==='menu')overlay('FOXFIRE TRAILS','Gather each blue wisp in order.','Press an arrow, WASD, or tap a neighbor');else if(state.mode==='paused')overlay('PAUSED','The foxfire is holding still.','Press P to continue');else if(state.mode==='between')overlay('TRAIL LIT!',`${state.wisps} wisps are glowing.`,'Move to enter the next forest trail');else if(state.mode==='won')overlay('FOREST AGLOW!',`${state.wisps} wisps gathered across five trails.`,'Move to journey again');else if(state.mode==='lost')overlay('LOST IN BRAMBLES',`${state.wisps} wisps gathered.`,'Move to try the trails again')}
function cycleTheme(){state.theme=(state.theme+1)%palettes.length;render()}async function fullscreen(){if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}
const dirs={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};document.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>move(...dirs[b.dataset.move]));document.querySelector('#pause').onclick=pause;document.querySelector('#restart').onclick=reset;document.querySelector('#theme').onclick=cycleTheme;document.querySelector('#full').onclick=fullscreen;document.querySelector('#feedback').onclick=()=>{if(state.mode==='playing')pause();document.querySelector('#cadeFeedbackOpenBtn')?.click()};canvas.addEventListener('pointerdown',e=>{canvas.focus();const r=canvas.getBoundingClientRect(),x=Math.floor(((e.clientX-r.left)*840/r.width-ox)/cell),y=Math.floor(((e.clientY-r.top)*600/r.height-oy)/cell),dx=x-state.pos[0],dy=y-state.pos[1];if(Math.abs(dx)+Math.abs(dy)===1)move(dx,dy)});document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable="true"],[role="dialog"]')||document.documentElement.dataset.cadeFeedbackOpen==='1')return;const k=e.key.toLowerCase(),map={arrowup:[0,-1],w:[0,-1],arrowdown:[0,1],s:[0,1],arrowleft:[-1,0],a:[-1,0],arrowright:[1,0],d:[1,0]};if(map[k]||['p','r','t','f'].includes(k)){e.preventDefault();if(e.repeat)return;if(map[k])move(...map[k]);else if(k==='p')pause();else if(k==='r')reset();else if(k==='t')cycleTheme();else fullscreen()}if(k==='escape'&&document.fullscreenElement)document.exitFullscreen()});
window.advanceTime=ms=>{manual=true;step(ms)};window.render_game_to_text=()=>JSON.stringify({coordinateSystem:'5x5 grid; origin top-left; x right, y down',mode:state.mode,trail:Math.min(5,state.trail+1),totalTrails:5,fox:{x:state.pos[0],y:state.pos[1]},nextWisp:level().wisps[state.wisp]?{x:level().wisps[state.wisp][0],y:level().wisps[state.wisp][1],number:state.wisp+1}:null,brambles:state.mode==='won'?[]:level().thorns.map(([x,y])=>({x,y})),wisps:state.wisps,bumps:state.bumps,timeMs:Math.round(state.elapsed),theme:p().name,message:state.message,metrics:metrics(),controls:'Arrows/WASD/buttons/tap neighbor; P pause; R restart; T palette; F fullscreen'});window.addEventListener('pagehide',()=>report('abandoned'));document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.mode==='playing')pause()});mountGameFeedback({gameSlug:'foxfiretrails',gameName:'Foxfire Trails'});function frame(now){if(!manual)step(Math.min(50,now-previous));previous=now;requestAnimationFrame(frame)}render();requestAnimationFrame(frame);
