</head><body><main><header><div><h1>🪁 Kite Circuit</h1><small>Ride the gusts through every sky ring.</small></div><a href="/">All games</a></header><section class="stats"><div><small>Course</small><b id="course"></b></div><div><small>Rings</small><b id="rings"></b></div><div><small>Lives</small><b id="lives"></b></div><div><small>Wind</small><b id="wind"></b></div><div><small>Time</small><b id="time"></b></div></section><section class="stage" id="stage"><canvas id="game" width="960" height="640" tabindex="0" aria-label="Kite Circuit wind course"></canvas></section><section class="controls"><button id="up">Up (↑)</button><button id="down">Down (↓)</button><button id="boost">Boost (Space)</button><button id="pause">Pause (P)</button><button id="restart">Restart (R)</button><button id="theme">Theme (T)</button><button id="full">Fullscreen (F)</button><button id="feedback">Feedback</button></section><div class="help"><b>Goal:</b> guide the kite through glowing rings in order. Hold Up/Down to steer and Space to boost against the wind. Avoid storm clouds. P pauses, R restarts, T changes the sky, and F toggles fullscreen.</div><div id="live" aria-live="polite"></div></main><script type="module">
import{addCoins}from'/src/core/state.js';import{reportGameOutcome}from'/src/core/outcomes.js';import{mountGameFeedback}from'/src/feedback/embed.js';
const c=document.querySelector('#game'),g=c.getContext('2d'),stage=document.querySelector('#stage'),E=Object.fromEntries(['course','rings','lives','wind','time'].map(k=>[k,document.querySelector('#'+k)]));
const THEMES=[{name:'Daybreak',a:'#72d7ed',b:'#dff9ff',kite:'#ef476f',ring:'#ffe66d',storm:'#415a77'},{name:'Sunset',a:'#ef8354',b:'#f7d6bf',kite:'#5d2e8c',ring:'#fff275',storm:'#403d58'},{name:'Mint',a:'#68d8d6',b:'#eafff5',kite:'#ff6b6b',ring:'#fff3b0',storm:'#315c63'}];
const COURSES=[{name:'Breezy Bend',wind:14,rings:[[230,235],[420,380],[610,220],[810,330]],clouds:[[510,300,48]]},{name:'Cloud Ladder',wind:20,rings:[[220,430],[370,310],[520,190],[680,310],[820,175]],clouds:[[300,205,45],[610,430,55]]},{name:'Crosswind',wind:-18,rings:[[190,180],[350,370],[520,180],[690,390],[840,235]],clouds:[[430,285,50],[760,120,42]]},{name:'High Spiral',wind:24,rings:[[180,330],[330,180],[500,330],[670,170],[825,330]],clouds:[[330,400,48],[600,280,46]]},{name:'Storm Thread',wind:-25,rings:[[175,160],[320,410],[470,210],[620,420],[760,175],[860,330]],clouds:[[250,285,44],[400,330,44],[560,290,46],[720,315,44]]}];
const S={mode:'menu',course:0,ring:0,total:0,lives:3,theme:0,elapsed:0,kite:{x:90,y:320,vx:115,vy:0},boost:false,up:false,down:false,status:'Press Space to launch',reported:false};let last=performance.now(),manualUntil=0;
const level=()=>COURSES[S.course],pal=()=>THEMES[S.theme],metrics=()=>({rings:S.total,courses:S.course+(S.mode==='won'?1:0),strikes:3-S.lives});
function report(result){if(S.reported)return;S.reported=true;reportGameOutcome({slug:'kitecircuit',result,durationMs:Math.round(S.elapsed),metrics:metrics()})}
function reset(mode='playing'){if(S.total&&!S.reported&&!['won','lost'].includes(S.mode))report('abandoned');Object.assign(S,{mode,course:0,ring:0,total:0,lives:3,elapsed:0,kite:{x:90,y:320,vx:115,vy:0},boost:false,up:false,down:false,status:mode==='menu'?'Press Space to launch':'Catch the first ring',reported:false});render()}
function start(){if(['menu','won','lost'].includes(S.mode))reset('playing');else if(S.mode==='course-complete'){S.course++;S.ring=0;S.kite={x:90,y:320,vx:115,vy:0};S.mode='playing';S.status='New wind, new course'}render()}
function strike(){S.lives--;if(S.lives<=0){S.mode='lost';S.status='The kite line snapped';report('loss')}else{S.kite={x:90,y:320,vx:115,vy:0};S.ring=0;S.status='Storm strike — course restarted'}}
function collect(){S.ring++;S.total++;addCoins(1);if(S.ring>=level().rings.length){if(S.course===COURSES.length-1){S.mode='won';S.status='All five circuits flown!';addCoins(15);report('success')}else{S.mode='course-complete';S.status=level().name+' cleared!'}}}
function update(dt){if(S.mode!=='playing')return;S.elapsed+=dt*1000;const k=S.kite,w=level().wind;k.vy+=((S.down?210:0)-(S.up?210:0))*dt;k.vy*=Math.pow(.985,dt*60);k.vx=115+w+(S.boost?85:0);k.x+=k.vx*dt;k.y+=k.vy*dt;if(k.y<22){k.y=22;k.vy=Math.abs(k.vy)*.4}if(k.y>565){k.y=565;k.vy=-Math.abs(k.vy)*.4}const r=level().rings[S.ring];if(r&&Math.hypot(k.x-r[0],k.y-r[1])<34)collect();for(const q of level().clouds)if(Math.hypot(k.x-q[0],k.y-q[1])<q[2]+15){strike();break}if(k.x>950){strike()}}
function step(ms){const n=Math.max(0,Math.round(ms/(1000/60)));for(let i=0;i<n;i++)update(1/60);render()}
function drawCloud(x,y,r,p){g.fillStyle=p.storm;for(const [dx,dy,s]of[[-.45,0,.55],[0,-.2,.72],[.48,.05,.5]]){g.beginPath();g.arc(x+dx*r,y+dy*r,r*s,0,7);g.fill()}g.fillRect(x-r*.65,y,x+r*.7-(x-r*.65),r*.35)}
function draw(){const p=pal(),bg=g.createLinearGradient(0,0,0,640);bg.addColorStop(0,p.a);bg.addColorStop(1,p.b);g.fillStyle=bg;g.fillRect(0,0,960,640);g.fillStyle='rgba(255,255,255,.5)';for(let i=0;i<7;i++){g.beginPath();g.arc(80+i*150,90+(i%3)*42,26,0,7);g.fill()}if(S.course<5){level().clouds.forEach(q=>drawCloud(...q,p));level().rings.forEach((r,i)=>{g.strokeStyle=i<S.ring?'rgba(255,255,255,.35)':i===S.ring?p.ring:'rgba(255,255,255,.55)';g.lineWidth=i===S.ring?10:5;g.beginPath();g.arc(r[0],r[1],27,0,7);g.stroke();g.fillStyle='#173f61';g.font='800 15px system-ui';g.textAlign='center';g.fillText(i+1,r[0],r[1]+5)});const k=S.kite;g.save();g.translate(k.x,k.y);g.rotate(Math.atan2(k.vy,k.vx)*.3);g.fillStyle=p.kite;g.beginPath();g.moveTo(0,-22);g.lineTo(24,0);g.lineTo(0,22);g.lineTo(-24,0);g.closePath();g.fill();g.strokeStyle='#fff';g.lineWidth=3;g.stroke();g.beginPath();g.moveTo(-24,0);g.quadraticCurveTo(-50,20,-70,42);g.stroke();g.restore()}if(['menu','paused','course-complete','won','lost'].includes(S.mode)){g.fillStyle='rgba(13,33,55,.78)';g.fillRect(0,0,960,640);g.fillStyle='#fff';g.textAlign='center';g.font='800 50px system-ui';g.fillText(S.mode==='menu'?'Kite Circuit':S.mode==='won'?'Sky champion!':S.mode==='lost'?'Line snapped':S.mode==='paused'?'Paused':'Course clear!',480,260);g.fillStyle=p.ring;g.font='700 23px system-ui';g.fillText(S.status,480,310);g.font='700 17px system-ui';g.fillText(S.mode==='paused'?'Press P to resume':'Press Space to continue',480,350)}}
function render(){E.course.textContent=`${Math.min(S.course+1,5)}/5`;E.rings.textContent=S.total;E.lives.textContent=S.lives;E.wind.textContent=(S.course<5?level().wind:0);E.time.textContent=(S.elapsed/1000).toFixed(1)+'s';draw()}
function pause(){if(S.mode==='paused'){S.mode=S.beforePause}else if(S.mode==='playing'){S.beforePause=S.mode;S.mode='paused'}render()}function key(e,on){if(['ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();if(e.code==='ArrowUp')S.up=on;if(e.code==='ArrowDown')S.down=on;if(e.code==='Space'){S.boost=on;if(on&&S.mode!=='playing')start()}if(on&&e.key==='Escape'&&document.fullscreenElement)document.exitFullscreen?.();if(on&&(e.key==='p'||e.key==='P'))pause();if(on&&(e.key==='r'||e.key==='R'))reset();if(on&&(e.key==='t'||e.key==='T')){S.theme=(S.theme+1)%3;render()}if(on&&(e.key==='f'||e.key==='F'))stage.requestFullscreen?.()}
document.addEventListener('keydown',e=>key(e,true));document.addEventListener('keyup',e=>key(e,false));for(const[id,prop]of[['up','up'],['down','down'],['boost','boost']]){const b=document.querySelector('#'+id);for(const ev of['pointerdown','touchstart'])b.addEventListener(ev,e=>{e.preventDefault();if(S.mode!=='playing')start();S[prop]=true},{passive:false});for(const ev of['pointerup','pointercancel','touchend'])b.addEventListener(ev,e=>{e.preventDefault();S[prop]=false},{passive:false})}document.querySelector('#pause').onclick=pause;document.querySelector('#restart').onclick=()=>reset();document.querySelector('#theme').onclick=()=>{S.theme=(S.theme+1)%3;render()};document.querySelector('#full').onclick=()=>stage.requestFullscreen?.();document.querySelector('#feedback').onclick=()=>document.querySelector('#cadeFeedbackOpenBtn')?.click();
function frame(now){if(now>manualUntil)step(Math.min(33,now-last));last=now;requestAnimationFrame(frame)}window.advanceTime=ms=>{manualUntil=performance.now()+350;last=performance.now();step(Math.max(0,Number(ms)||0))};window.render_game_to_text=()=>JSON.stringify({coordinateSystem:'canvas origin top-left; x increases right, y increases down',mode:S.mode,course:{index:Math.min(S.course+1,5),total:5,name:S.course<5?level().name:'complete',wind:S.course<5?level().wind:0},kite:{x:Math.round(S.kite.x),y:Math.round(S.kite.y),vx:Math.round(S.kite.vx),vy:Math.round(S.kite.vy)},nextRing:S.course<5?(level().rings[S.ring]||null):null,ringIndex:S.ring,clouds:S.course<5?level().clouds:[],lives:S.lives,timeMs:Math.round(S.elapsed),theme:pal().name,status:S.status,metrics:metrics(),controls:'Up/Down steer; Space boost/continue; P pause; R restart; T theme; F fullscreen'});window.__KITE_CIRCUIT__={snapshot:()=>JSON.parse(window.render_game_to_text()),reset:()=>reset(),setKite:(x,y)=>{S.kite.x=x;S.kite.y=y;render()},collect,forceStrike:strike,solveCourse:()=>{while(S.mode==='playing')collect();return S.mode},solveCampaign:()=>{if(S.mode!=='playing')reset();while(S.mode!=='won'){while(S.mode==='playing')collect();if(S.mode==='course-complete')start()}return S.mode}};mountGameFeedback({gameSlug:'kitecircuit',gameName:'Kite Circuit'});reset('menu');requestAnimationFrame(frame);
</script></body></html>
