</head><body><main><h1>🌱 Signal Garden</h1><canvas id="game" width="840" height="600" tabindex="0" aria-label="Signal Garden game"></canvas><div class="controls"><button data-pad="0">1</button><button data-pad="1">2</button><button data-pad="2">3</button><button data-pad="3">4</button><button id="pause">Pause</button><button id="restart">Restart</button><button id="theme">Colors</button><button id="full">Full</button><button id="feedback">Feedback</button></div><p class="help"><b>Echo five gardens.</b> Watch the fireflies, then repeat their pattern with keys 1–4 or the four garden buttons. Each garden adds one signal. Three mistakes end the night. P pauses, R restarts, T changes colors, F toggles fullscreen.</p></main><script type="module">
import { addCoins } from '/src/core/state.js';import { reportGameOutcome } from '/src/core/outcomes.js';import { mountGameFeedback } from '/src/feedback/embed.js';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),palettes=[{name:'Meadow',sky:'#dff4d8',ground:'#5b8c51',leaf:'#276749',light:'#ffe66d',accent:'#ff8c61',ink:'#18382a'},{name:'Twilight',sky:'#312e59',ground:'#375a4c',leaf:'#1d3d38',light:'#9fffe0',accent:'#ff9bd2',ink:'#f5f1ff'},{name:'Moonrise',sky:'#dce7ff',ground:'#7085ad',leaf:'#40577d',light:'#fff3a6',accent:'#ed6a5a',ink:'#172b4d'}],centers=[[210,240],[630,240],[280,430],[560,430]],sequences=[[0,2,1],[3,0,2,1],[1,3,0,2,3],[2,0,3,1,0,2],[3,2,1,0,2,3,1]],state={mode:'menu',garden:0,signals:0,mistakes:0,input:0,showIndex:0,showTimer:0,lit:-1,elapsed:0,theme:0,started:false,reported:false};let manual=false,previous=performance.now();const p=()=>palettes[state.theme],seq=()=>sequences[state.garden],metrics=()=>({signals:state.signals,gardens:state.garden,mistakes:state.mistakes});
function report(result){if(!state.started||state.reported)return;state.reported=true;reportGameOutcome({slug:'signalgarden',result,durationMs:Math.round(state.elapsed),metrics:metrics()})}function restart(){report('abandoned');Object.assign(state,{mode:'menu',garden:0,signals:0,mistakes:0,input:0,showIndex:0,showTimer:0,lit:-1,elapsed:0,started:false,reported:false});render()}function begin(){state.started=true;state.mode='showing';state.showIndex=0;state.showTimer=400;state.lit=-1;render()}function start(){if(state.mode==='menu')begin();else if(state.mode==='between'){state.garden++;begin()}else if(state.mode==='lost'||state.mode==='won'){restart();begin()}}function choose(i){if(state.mode!=='input'){if(['menu','between','lost','won'].includes(state.mode))start();return}state.lit=i;state.showTimer=160;if(i===seq()[state.input]){state.signals++;state.input++;if(state.input===seq().length){if(state.garden===4){state.mode='won';addCoins(15);report('completed')}else state.mode='between'}}else{state.mistakes++;state.input=0;if(state.mistakes>=3){state.mode='lost';report('lost')}else{state.mode='showing';state.showIndex=0;state.showTimer=500}}render()}function pause(){if(['showing','input'].includes(state.mode))state.modeBeforePause=state.mode,state.mode='paused';else if(state.mode==='paused')state.mode=state.modeBeforePause;render()}function update(ms){if(!['showing','input'].includes(state.mode))return;state.elapsed+=ms;if(state.showTimer>0){state.showTimer-=ms;if(state.showTimer<=0){state.lit=-1;if(state.mode==='showing'){if(state.showIndex<seq().length){state.lit=seq()[state.showIndex++];state.showTimer=state.showIndex===1?520:620}else{state.mode='input';state.input=0}}}}}function step(ms){let n=Math.max(0,Number(ms)||0);if(!Number.isFinite(n))return;while(n>0){const d=Math.min(10,n);update(d);n-=d}render()}function text(s,x,y,size=20,color=p().ink){ctx.fillStyle=color;ctx.font=`700 ${size}px system-ui`;ctx.textAlign='center';ctx.fillText(s,x,y)}function overlay(a,b,c){ctx.fillStyle='#102b24dd';ctx.fillRect(115,175,610,230);text(a,420,240,40,'#fff');text(b,420,298,21,'#effff4');text(c,420,354,18,p().accent)}
function render(){const q=p();ctx.fillStyle=q.sky;ctx.fillRect(0,0,840,600);ctx.fillStyle=q.ground;ctx.fillRect(0,150,840,450);for(let x=20;x<840;x+=55){ctx.fillStyle=q.leaf;ctx.beginPath();ctx.ellipse(x,165+(x%5)*75,35,15,-.4,0,Math.PI*2);ctx.fill()}text(`GARDEN ${Math.min(5,state.garden+1)} / 5`,420,48,18);text(`Signals ${state.signals}   Mistakes ${state.mistakes}/3`,420,78,18);centers.forEach(([x,y],i)=>{ctx.fillStyle=q.leaf;ctx.beginPath();ctx.arc(x,y,82,0,Math.PI*2);ctx.fill();ctx.fillStyle=state.lit===i?q.light:'#ffffff55';ctx.shadowColor=q.light;ctx.shadowBlur=state.lit===i?32:0;ctx.beginPath();ctx.arc(x,y,30,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;text(String(i+1),x,y+8,22,state.lit===i?q.ink:'#fff')});if(state.mode==='menu')overlay('SIGNAL GARDEN','Remember each firefly pattern.','Press 1–4 or tap a light to begin');else if(state.mode==='paused')overlay('PAUSED','The fireflies hold their glow.','Press P to continue');else if(state.mode==='between')overlay('GARDEN COMPLETE!',`${seq().length} signals remembered.`,'Press any light for the next garden');else if(state.mode==='won')overlay('GARDENS AGLOW!',`${state.signals} signals remembered.`,'Press any light to play again');else if(state.mode==='lost')overlay('NIGHT FALLS!',`${state.signals} signals remembered.`,'Press any light to try again');else text(state.mode==='showing'?'WATCH':'YOUR TURN',420,555,22,state.mode==='showing'?q.light:q.ink)}
function cycleTheme(){state.theme=(state.theme+1)%palettes.length;render()}async function fullscreen(){if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}document.querySelectorAll('[data-pad]').forEach(b=>b.onclick=()=>choose(Number(b.dataset.pad)));document.querySelector('#pause').onclick=pause;document.querySelector('#restart').onclick=restart;document.querySelector('#theme').onclick=cycleTheme;document.querySelector('#full').onclick=fullscreen;document.querySelector('#feedback').onclick=()=>{if(['showing','input'].includes(state.mode))pause();document.querySelector('#cadeFeedbackOpenBtn')?.click()};canvas.addEventListener('pointerdown',e=>{canvas.focus();const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*840/r.width,y=(e.clientY-r.top)*600/r.height;let best=0,dist=Infinity;centers.forEach(([a,b],i)=>{const d=(x-a)**2+(y-b)**2;if(d<dist)dist=d,best=i});choose(best)});document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable="true"],[role="dialog"]')||document.documentElement.dataset.cadeFeedbackOpen==='1')return;const k=e.key.toLowerCase();if(['1','2','3','4','p','r','t','f'].includes(k)){e.preventDefault();if(e.repeat)return;if('1234'.includes(k))choose(Number(k)-1);else if(k==='p')pause();else if(k==='r')restart();else if(k==='t')cycleTheme();else fullscreen()}if(k==='escape'&&document.fullscreenElement)document.exitFullscreen()});window.advanceTime=ms=>{manual=true;step(ms)};window.render_game_to_text=()=>JSON.stringify({coordinateSystem:'840x600 canvas; origin top-left; x right, y down; four lights numbered 1-4',mode:state.mode,garden:state.garden+1,totalGardens:5,sequenceLength:seq().length,showIndex:state.showIndex,inputIndex:state.input,litLight:state.lit<0?null:state.lit+1,signals:state.signals,mistakes:state.mistakes,timeMs:Math.round(state.elapsed),theme:p().name,metrics:metrics(),controls:'Keys 1-4 or tap lights; P pause; R restart; T palette; F fullscreen'});window.addEventListener('pagehide',()=>report('abandoned'));document.addEventListener('visibilitychange',()=>{if(document.hidden&&['showing','input'].includes(state.mode))pause()});mountGameFeedback({gameSlug:'signalgarden',gameName:'Signal Garden'});function frame(now){if(!manual)step(Math.min(50,now-previous));previous=now;requestAnimationFrame(frame)}render();requestAnimationFrame(frame);
</script></body></html>
