</head><body><main><h1>🐝 Pollen Passage</h1><canvas id="game" width="840" height="600" tabindex="0" aria-label="Pollen Passage game"></canvas><div class="controls"><button data-lane="0">Top</button><button data-lane="1">Middle</button><button data-lane="2">Bottom</button><button id="pause">Pause</button><button id="restart">Restart</button><button id="theme">Colors</button><button id="full">Full</button><button id="feedback">Feedback</button></div><p class="help"><b>Cross five meadows.</b> Move the bee into the flower lane and away from the thorn lane before each gate arrives. Use ↑/↓ or 1–3, or tap a lane. Three stings end the flight. P pauses, R restarts, T changes colors, F toggles fullscreen.</p></main><script type="module">
import { addCoins } from '/src/core/state.js';import { reportGameOutcome } from '/src/core/outcomes.js';import { mountGameFeedback } from '/src/feedback/embed.js';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),lanes=[225,350,475],patterns=[[[0,2],[2,0],[1,2],[0,1],[2,1]],[[1,0],[0,2],[2,1],[1,2],[0,1]],[[2,0],[1,2],[0,1],[2,1],[1,0]],[[0,2],[1,0],[2,1],[0,1],[1,2]],[[2,1],[0,2],[1,0],[2,0],[0,1]]],palettes=[{name:'Honey',sky:'#fff3c8',hill:'#9fcb68',field:'#5f9e50',lane:'#f8e6a0',flower:'#fffdf2',center:'#f5a623',thorn:'#7b3f54',bee:'#2d271d',wing:'#d9f6ff',accent:'#e85d75',ink:'#27351f'},{name:'Bluebell',sky:'#dff4ff',hill:'#7da8c9',field:'#527aa3',lane:'#c7e7ef',flower:'#e9ddff',center:'#7357b8',thorn:'#542f67',bee:'#142536',wing:'#f4fdff',accent:'#ff8a5b',ink:'#10293a'},{name:'Sunset',sky:'#ffe0c2',hill:'#d97a62',field:'#9e4e5e',lane:'#f6bd8b',flower:'#fff2df',center:'#ffcb47',thorn:'#4b2942',bee:'#2a1b24',wing:'#ffeefa',accent:'#68d6c3',ink:'#3b2030'}],state={mode:'menu',meadow:0,gate:0,lane:1,gateX:800,blooms:0,stings:0,elapsed:0,theme:0,started:false,reported:false};let manual=false,previous=performance.now();const p=()=>palettes[state.theme],pair=()=>patterns[state.meadow][state.gate],metrics=()=>({blooms:state.blooms,meadows:state.meadow,stings:state.stings});
function report(result){if(!state.started||state.reported)return;state.reported=true;reportGameOutcome({slug:'pollenpassage',result,durationMs:Math.round(state.elapsed),metrics:metrics()})}function reset(){report('abandoned');Object.assign(state,{mode:'menu',meadow:0,gate:0,lane:1,gateX:800,blooms:0,stings:0,elapsed:0,started:false,reported:false});render()}function start(){if(state.mode==='menu'){state.started=true;state.mode='playing'}else if(state.mode==='between'){state.meadow++;state.gate=0;state.gateX=800;state.mode='playing'}else if(state.mode==='won'||state.mode==='lost'){reset();state.started=true;state.mode='playing'}render()}function setLane(n){if(['menu','between','won','lost'].includes(state.mode))start();if(state.mode==='playing')state.lane=Math.max(0,Math.min(2,n));render()}function move(d){setLane(state.lane+d)}function pause(){if(state.mode==='playing')state.mode='paused';else if(state.mode==='paused')state.mode='playing';render()}
function resolveGate(){const [flower,thorn]=pair();if(state.lane===flower)state.blooms++;else if(state.lane===thorn)state.stings++;state.gate++;if(state.stings>=3){state.mode='lost';report('lost')}else if(state.gate>=5){state.meadow++;if(state.meadow>=5){state.meadow=5;state.mode='won';addCoins(15);report('completed')}else{state.meadow--;state.mode='between'}}state.gateX=800}function update(ms){if(state.mode!=='playing')return;state.elapsed+=ms;state.gateX-=.25*ms;if(state.gateX<=145)resolveGate()}function step(ms){let n=Math.max(0,Number(ms)||0);if(!Number.isFinite(n))return;while(n>0){const d=Math.min(10,n);update(d);n-=d}render()}
function text(s,x,y,size=20,color=p().ink){ctx.fillStyle=color;ctx.font=`700 ${size}px system-ui`;ctx.textAlign='center';ctx.fillText(s,x,y)}function flower(x,y,thorn=false){const q=p();if(thorn){ctx.strokeStyle=q.thorn;ctx.lineWidth=8;for(let a=0;a<6;a++){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(a*Math.PI/3)*34,y+Math.sin(a*Math.PI/3)*34);ctx.stroke()}ctx.fillStyle=q.thorn;ctx.beginPath();ctx.arc(x,y,17,0,Math.PI*2);ctx.fill();return}for(let a=0;a<8;a++){ctx.fillStyle=q.flower;ctx.beginPath();ctx.ellipse(x+Math.cos(a*Math.PI/4)*22,y+Math.sin(a*Math.PI/4)*22,13,22,a*Math.PI/4,0,Math.PI*2);ctx.fill()}ctx.fillStyle=q.center;ctx.beginPath();ctx.arc(x,y,15,0,Math.PI*2);ctx.fill()}function bee(x,y){const q=p();ctx.fillStyle=q.wing;ctx.beginPath();ctx.ellipse(x-3,y-20,20,11,-.5,0,Math.PI*2);ctx.ellipse(x+16,y-18,20,11,.5,0,Math.PI*2);ctx.fill();ctx.fillStyle=q.bee;ctx.beginPath();ctx.ellipse(x,y,25,17,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle=q.center;ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(x-9,y-14);ctx.lineTo(x-9,y+14);ctx.moveTo(x+7,y-14);ctx.lineTo(x+7,y+14);ctx.stroke();ctx.fillStyle=q.ink;ctx.beginPath();ctx.arc(x+23,y-3,3,0,Math.PI*2);ctx.fill()}function overlay(a,b,c){ctx.fillStyle='#20321cdd';ctx.fillRect(105,170,630,245);text(a,420,238,40,'#fff');text(b,420,300,21,'#efffe8');text(c,420,360,18,p().accent)}
function render(){const q=p();ctx.fillStyle=q.sky;ctx.fillRect(0,0,840,600);ctx.fillStyle=q.hill;ctx.beginPath();ctx.moveTo(0,165);ctx.quadraticCurveTo(210,80,420,165);ctx.quadraticCurveTo(630,70,840,165);ctx.lineTo(840,600);ctx.lineTo(0,600);ctx.fill();ctx.fillStyle=q.field;ctx.fillRect(0,175,840,425);lanes.forEach((y,i)=>{ctx.fillStyle=q.lane;ctx.globalAlpha=i===state.lane?.9:.55;ctx.fillRect(0,y-43,840,86);ctx.globalAlpha=1;text(String(i+1),35,y+7,18,q.ink)});text(`MEADOW ${Math.min(5,state.meadow+1)} / 5`,420,42,18);text(`Blooms ${state.blooms}   Stings ${state.stings}/3`,420,72,18);bee(145,lanes[state.lane]);if(state.mode==='playing'||state.mode==='paused'){const [f,t]=pair();flower(state.gateX,lanes[f]);flower(state.gateX,lanes[t],true);text(`Gate ${state.gate+1}/5`,705,560,18,q.ink)}if(state.mode==='menu')overlay('POLLEN PASSAGE','Choose a lane before each gate arrives.','Press ↑/↓, 1–3, or tap a lane');else if(state.mode==='paused')overlay('PAUSED','The meadow breeze is still.','Press P to continue');else if(state.mode==='between')overlay('MEADOW CROSSED!',`${state.blooms} blooms gathered.`,'Choose a lane for the next meadow');else if(state.mode==='won')overlay('HIVE SUPPLIED!',`${state.blooms} blooms gathered.`,'Choose a lane to fly again');else if(state.mode==='lost')overlay('WINGS TANGLED!',`${state.blooms} blooms gathered.`,'Choose a lane to try again')}
function cycleTheme(){state.theme=(state.theme+1)%palettes.length;render()}async function fullscreen(){if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}document.querySelectorAll('[data-lane]').forEach(b=>b.onclick=()=>setLane(Number(b.dataset.lane)));document.querySelector('#pause').onclick=pause;document.querySelector('#restart').onclick=reset;document.querySelector('#theme').onclick=cycleTheme;document.querySelector('#full').onclick=fullscreen;document.querySelector('#feedback').onclick=()=>{if(state.mode==='playing')pause();document.querySelector('#cadeFeedbackOpenBtn')?.click()};canvas.addEventListener('pointerdown',e=>{canvas.focus();const r=canvas.getBoundingClientRect(),y=(e.clientY-r.top)*600/r.height;setLane(lanes.reduce((best,v,i)=>Math.abs(v-y)<Math.abs(lanes[best]-y)?i:best,0))});document.addEventListener('keydown',e=>{if(e.target.closest('input,textarea,select,[contenteditable="true"],[role="dialog"]')||document.documentElement.dataset.cadeFeedbackOpen==='1')return;const k=e.key.toLowerCase();if(['arrowup','arrowdown','1','2','3','p','r','t','f'].includes(k)){e.preventDefault();if(e.repeat)return;if(k==='arrowup')move(-1);else if(k==='arrowdown')move(1);else if('123'.includes(k))setLane(Number(k)-1);else if(k==='p')pause();else if(k==='r')reset();else if(k==='t')cycleTheme();else fullscreen()}if(k==='escape'&&document.fullscreenElement)document.exitFullscreen()});window.advanceTime=ms=>{manual=true;step(ms)};window.render_game_to_text=()=>JSON.stringify({coordinateSystem:'840x600 canvas; origin top-left; x right, y down; lanes 1-3 are top-bottom',mode:state.mode,meadow:Math.min(5,state.meadow+1),totalMeadows:5,gate:state.gate+1,beeLane:state.lane+1,gateX:Math.round(state.gateX),flowerLane:state.mode==='playing'||state.mode==='paused'?pair()[0]+1:null,thornLane:state.mode==='playing'||state.mode==='paused'?pair()[1]+1:null,blooms:state.blooms,stings:state.stings,timeMs:Math.round(state.elapsed),theme:p().name,metrics:metrics(),controls:'Arrow keys or 1-3/tap lanes; P pause; R restart; T palette; F fullscreen'});window.addEventListener('pagehide',()=>report('abandoned'));document.addEventListener('visibilitychange',()=>{if(document.hidden&&state.mode==='playing')pause()});mountGameFeedback({gameSlug:'pollenpassage',gameName:'Pollen Passage'});function frame(now){if(!manual)step(Math.min(50,now-previous));previous=now;requestAnimationFrame(frame)}render();requestAnimationFrame(frame);
